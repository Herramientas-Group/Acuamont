<p-confirmDialog />

<div class="p-1">
  <div class="bg-white rounded-3xl shadow-sm border border-blue-100/50 p-8 mb-6 backdrop-blur-sm">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
      <div>
        <h3
          class="text-4xl font-bold bg-gradient-to-r from-[#0D72C5] to-[#0a5a9c] bg-clip-text text-transparent mb-2">
          Lista de Categorías
        </h3>
        <p class="text-gray-600 text-sm flex items-center gap-2">
          Gestiona tus categorías de manera eficiente
        </p>
      </div>
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
        <button (click)="abrirModal()"
          class="bg-[#0D72C5] hover:bg-[#0a5a9c] text-white px-6 py-3 rounded-xl transition-all flex items-center justify-center gap-2 font-semibold text-sm shadow-lg shadow-blue-200/50 hover:shadow-xl hover:shadow-blue-300/50 hover:-translate-y-0.5 whitespace-nowrap group cursor-pointer">
          <span
            class="material-symbols-outlined text-lg group-hover:rotate-90 transition-transform">add</span>
          Nuevo Registro
        </button>
      </div>
    </div>
    <hr class="border-gray-100 my-6" />
    <div class="flex flex-wrap items-end gap-4">
      <div class="flex flex-wrap items-end gap-4 flex-1">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Buscar por nombre</label>
          <input pInputText [(ngModel)]="filtroNombre" placeholder="Buscar..."
            class="w-64" (input)="aplicarFiltros()" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Estado</label>
          <p-select [options]="estadosFiltro" [(ngModel)]="filtroEstado"
            placeholder="Todos" optionLabel="label" optionValue="value"
            (onChange)="aplicarFiltros()" styleClass="w-48" [appendTo]="'body'" />
        </div>
      </div>
      <button (click)="limpiarFiltros()"
        class="px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-600 hover:bg-gray-100 transition-all cursor-pointer text-sm font-semibold">
        Limpiar
      </button>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-blue-100/50 backdrop-blur-sm overflow-hidden">
    <div class="overflow-visible">
      <p-table
        #dt
        [value]="filteredCategorias"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        sortMode="single"
        [customSort]="true"
        (onSort)="customSort($event)"
        dataKey="id"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
        styleClass="!border-none"
      >
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id" class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">
              ID <p-sortIcon field="id" />
            </th>
            <th pSortableColumn="nombre" class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">
              Nombre <p-sortIcon field="nombre" />
            </th>
            <th pSortableColumn="estado" class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">
              Estado <p-sortIcon field="estado" />
            </th>
            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider !text-center">Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cat>
          <tr class="hover:bg-blue-50/30 transition-colors">
            <td class="px-6 py-4 text-sm font-medium text-gray-400">#{{cat.id}}</td>
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div
                  class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-[#0D72C5] font-bold text-xs">
                  {{cat.nombre[0]}}
                </div>
                <p class="text-sm font-semibold text-gray-800">{{cat.nombre}}</p>
              </div>
            </td>
            <td class="px-6 py-4">
              <span [ngClass]="{
                'bg-green-100 text-green-700': cat.estado === 1,
                'bg-red-100 text-red-700': cat.estado === 0
              }" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                {{ cat.estado === 1 ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="px-6 py-4">
              <div class="flex justify-center gap-2">
                <button (click)="abrirModal(cat)"
                  class="p-2 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors cursor-pointer"
                  title="Editar">
                  <span class="material-symbols-outlined text-sm">edit</span>
                </button>
                <button (click)="toggleEstado(cat.id!)"
                  class="p-2 text-amber-600 hover:bg-amber-100 rounded-lg transition-colors cursor-pointer"
                  title="Cambiar estado">
                  <span class="material-symbols-outlined text-sm">sync_alt</span>
                </button>
                <button (click)="eliminarCategoria(cat.id!)"
                  class="p-2 text-red-600 hover:bg-red-100 rounded-lg transition-colors cursor-pointer"
                  title="Eliminar">
                  <span class="material-symbols-outlined text-sm">delete</span>
                </button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="px-6 py-12 text-center">
              <div class="flex flex-col items-center gap-2 text-gray-400">
                <span class="material-symbols-outlined text-4xl">folder_open</span>
                <p class="text-sm">No se encontraron categorías registradas.</p>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="modalVisible"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="!rounded-2xl !p-0 !shadow-2xl"
  header="{{ editando ? 'Editar Categoría' : 'Nueva Categoría' }}"
>
  <div class="p-6">
    <form #categoriaForm="ngForm">
      <input type="hidden" name="id" [(ngModel)]="formCategoria.id" />
      <div class="flex flex-col gap-2 mb-4">
        <label for="nombre" class="text-sm font-semibold text-gray-700">Nombre</label>
        <input
          id="nombre"
          name="nombre"
          pInputText
          [(ngModel)]="formCategoria.nombre"
          placeholder="Ingrese el nombre"
          required
          class="w-full"
        />
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button type="button" (click)="cerrarModal()"
          class="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 hover:bg-gray-100 transition-all cursor-pointer text-sm font-semibold">
          Cancelar
        </button>
        <button type="submit" (click)="guardarCategoria()"
          [disabled]="!formCategoria.nombre.trim()"
          class="bg-[#0D72C5] hover:bg-[#0a5a9c] disabled:opacity-50 disabled:cursor-not-allowed text-white px-5 py-2.5 rounded-xl transition-all cursor-pointer text-sm font-semibold shadow-lg shadow-blue-200/50">
          Guardar
        </button>
      </div>
    </form>
  </div>
</p-dialog>
