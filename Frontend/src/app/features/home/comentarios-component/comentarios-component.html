<div class="min-h-screen">
  <app-navbar-component></app-navbar-component>

  <div class="container mx-auto px-4 py-12">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <div class="lg:col-span-1">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h4 class="text-lg font-bold text-gray-800 pb-3 border-b-2 border-gray-800 mb-4">Cuéntanos tu experiencia</h4>
          <form (ngSubmit)="enviarComentario()" #commentForm="ngForm" class="space-y-4">
            <div>
              <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-1">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" [(ngModel)]="formNombre" required
                placeholder="nombres y apellidos"
                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0D72C5] focus:border-transparent transition-all" />
            </div>
            <div>
              <label for="mensaje" class="block text-sm font-semibold text-gray-700 mb-1">Comentario</label>
              <textarea id="mensaje" name="mensaje" [(ngModel)]="formMensaje" required rows="5"
                placeholder="Escribe tu experiencia..."
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0D72C5] focus:border-transparent transition-all resize-none"></textarea>
            </div>
            <div>
              <label for="imagen" class="block text-sm font-semibold text-gray-700 mb-1">Sube una imagen (opcional)</label>
              <input type="file" id="imagen" accept="image/*" (change)="onFileSelected($event)"
                class="w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-[#0D72C5] hover:file:bg-blue-100 transition-all cursor-pointer" />
            </div>
            <button type="submit" [disabled]="!commentForm.form.valid || enviando"
              class="w-full py-3 rounded-xl text-white text-sm font-semibold shadow-sm hover:opacity-90 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
              style="background-color: #061748">
              {{ enviando ? 'Enviando...' : 'Enviar Comentario' }}
            </button>
          </form>
        </div>
      </div>

      <div class="lg:col-span-3">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 class="text-lg font-bold text-gray-800 pb-3 border-b-2 border-gray-800 mb-6">Comentarios de nuestros clientes</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div *ngFor="let c of comentarios" class="bg-gray-50 rounded-xl p-4 border border-gray-100">
              <div class="flex items-start gap-3 mb-2">
                <div class="w-10 h-10 rounded-full bg-[#0D72C5] flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
                  {{getInitial(c.nombre)}}
                </div>
                <div class="min-w-0">
                  <p class="text-sm font-bold text-gray-800">{{c.nombre}}</p>
                  <p class="text-[10px] text-gray-400">{{formatDate(c.fechaCreacion)}}</p>
                </div>
              </div>
              <p class="text-sm text-gray-600 leading-relaxed">{{c.mensaje}}</p>
              <img *ngIf="c.imagen" [src]="c.imagen" alt="Foto del comentario"
                class="mt-3 rounded-lg max-h-32 object-cover"
                (error)="onImageError($event)" />
            </div>
          </div>
          <div *ngIf="!comentarios.length" class="text-center py-12 text-gray-400 text-sm">
            <span class="material-symbols-outlined text-4xl block mb-2">chat</span>
            No hay comentarios aún. ¡Sé el primero en compartir tu experiencia!
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-footer-component></app-footer-component>
</div>
