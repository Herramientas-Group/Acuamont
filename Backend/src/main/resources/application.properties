# Hibernate comparara las entidades (@Entity) con el esquema de la base de datos al arrancar
# y anadira automaticamente las tablas o columnas que falten. Util para desarrollo.
spring.jpa.hibernate.ddl-auto=update

# Configuracion de la fuente de datos (DataSource).
spring.datasource.url=jdbc:postgresql://localhost:5432/acceso

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:}

# Muestra en la consola todas las sentencias SQL que Hibernate ejecuta.
spring.jpa.show-sql=true

# Mantiene abierta la sesion de Hibernate durante toda la peticion HTTP.
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:}
jwt.expiration=28800000

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:johnchm007@gmail.com}
mail.fromName=${MAIL_FROM_NAME:Acuamont S.A.C.}

# Documento API (consulta DNI/RUC)
documento.tokenCode=${DOCUMENTO_TOKEN_CODE}
documento.urlDni=${DOCUMENTO_URL_DNI:https://miapi.cloud/v1/dni/}
documento.urlRuc=${DOCUMENTO_URL_RUC:https://miapi.cloud/v1/ruc/}

