# Configuracion de test - sobreescribe valores de application.properties
# cuando se activa el perfil "test"

# DB (H2 en memoria para tests de integración)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar SQL log en tests
spring.jpa.show-sql=false

# JWT
jwt.secret=testSecretKeyForTestingPurposesOnly32Chars!
jwt.expiration=28800000

# Cloudinary (mockeado)
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test

# Mail (mockeado)
spring.mail.host=localhost
spring.mail.port=25
mail.from=test@test.com
mail.fromName=Test

# Documento API (mockeado)
documento.tokenCode=test
documento.urlDni=https://test.com/dni/
documento.urlRuc=https://test.com/ruc/
